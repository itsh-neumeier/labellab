[workspace]
resolver = "2"
members = [
    "crates/ll-protocol",
    "crates/ll-transport",
    "crates/ll-render",
    "crates/ll-core",
    "crates/ll-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/itsh-neumeier/labellab"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
tokio-serial = "5"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
qrcode = { version = "0.14", default-features = false }
barcoders = { version = "2", default-features = false, features = ["std"] }
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
fontdb = "0.24"
csv = "1"
nusb = { version = "0.2", features = ["tokio"] }
