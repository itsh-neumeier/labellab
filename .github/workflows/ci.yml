name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install libudev and a system font (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # The Tauri GUI is its own Cargo workspace (app/src-tauri, ADR-014):
  # building it needs WebKitGTK on Linux, which the library job skips.
  app:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
          libudev-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: frontend (type-check + build)
        run: npm ci && npm run build
      - name: fmt
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: app/src-tauri
        # The ll-* crates are path dependencies here, so rust-cache restores
        # them like registry crates; force a rebuild against the checkout.
        run: |
          cargo clean -p ll-core -p ll-render -p ll-protocol -p ll-transport
          cargo clippy --all-targets -- -D warnings
