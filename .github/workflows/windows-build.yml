name: Windows build

# Builds the portable Windows binaries (no installer) on every push and on
# demand:
# - LabelLab.exe   GUI, standalone (needs only the WebView2 runtime,
#                  preinstalled on Windows 11 / current Windows 10)
# - labellab.exe   command-line tool
# Download them from the run's "Artifacts" section. Tags `v*` also attach
# them to a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - name: install frontend dependencies
        working-directory: app
        run: npm ci
      - name: build GUI (portable exe, bundling disabled in tauri.conf.json)
        working-directory: app
        # The ll-* crates are path dependencies of the app workspace, so
        # rust-cache restores them like registry crates; force a rebuild.
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml --release -p ll-core -p ll-render -p ll-protocol -p ll-transport
          npx tauri build
      - name: build CLI
        run: cargo build --release -p ll-cli
      - name: collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item app/src-tauri/target/release/LabelLab.exe dist-windows/
          Copy-Item target/release/labellab.exe dist-windows/
          Copy-Item docs/LIESMICH-windows.txt dist-windows/LIESMICH.txt
          Get-ChildItem dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: LabelLab-windows-x64-portable
          path: dist-windows/*
      - name: attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/*
