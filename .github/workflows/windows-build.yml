name: Windows build

# Builds the ready-to-run Windows binaries on every push and on demand:
# - LabelLab.exe          GUI, standalone (needs only the WebView2 runtime,
#                         preinstalled on Windows 11 / current Windows 10)
# - LabelLab_*-setup.exe  NSIS installer (per-user, no admin rights)
# - LabelLab_*.msi        MSI installer
# - labellab.exe          command-line tool
# Download them from the run's "Artifacts" section. Tags `v*` also attach
# them to a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - name: install frontend dependencies
        working-directory: app
        run: npm ci
      - name: build GUI + installers
        working-directory: app
        run: npx tauri build --bundles nsis,msi
      - name: build CLI
        run: cargo build --release -p ll-cli
      - name: collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item app/src-tauri/target/release/LabelLab.exe dist-windows/
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe dist-windows/
          Copy-Item app/src-tauri/target/release/bundle/msi/*.msi dist-windows/
          Copy-Item target/release/labellab.exe dist-windows/
          Get-ChildItem dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: LabelLab-windows-x64
          path: dist-windows/*
      - name: attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/*
