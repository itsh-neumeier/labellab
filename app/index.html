<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabelLab</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-new" data-i18n="toolbar.new"></button>
      <button id="btn-open" data-i18n="toolbar.open"></button>
      <select id="recent" aria-label="Zuletzt verwendet"></select>
      <button id="btn-history" data-i18n="history.open"></button>
      <button id="btn-save" data-i18n="toolbar.saveNow" data-i18n-title="toolbar.saveHint"></button>
      <button id="btn-save-as" data-i18n="toolbar.saveAs"></button>
      <label class="autosave" data-i18n-title="toolbar.autosaveHint"><input type="checkbox" id="autosave" /> <span data-i18n="toolbar.autosave"></span></label>
      <span class="sep"></span>
      <button id="btn-undo" class="icon-btn" data-i18n-title="toolbar.undoHint"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="btn-redo" class="icon-btn" data-i18n-title="toolbar.redoHint"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <button id="btn-wizard" data-i18n="toolbar.wizard" data-i18n-title="toolbar.wizardHint"></button>
      <span class="spacer"></span>
      <span id="file-name" class="muted"></span>
      <button id="btn-about" data-i18n="about.open"></button>
      <div id="lang"></div>
    </header>

    <section class="devicebar">
      <label><span data-i18n="device.printer"></span>
        <select id="device"></select>
      </label>
      <button id="btn-refresh" data-i18n="device.refresh"></button>
      <button id="btn-status" data-i18n="device.readStatus"></button>
      <button id="btn-info" data-i18n="info.open"></button>
      <button id="btn-keepalive" class="keepalive" data-i18n="device.keepAlive" data-i18n-title="device.keepAliveHint"></button>
      <button id="btn-pair" data-i18n="pair.open"></button>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <label><span data-i18n="device.model"></span>
        <select id="model"></select>
      </label>
      <label><span data-i18n="device.tape"></span>
        <select id="width"></select>
      </label>
      <label data-i18n-title="device.stripsHint"><span data-i18n="device.strips"></span>
        <select id="strips">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </label>
    </section>

    <main>
      <aside class="panel">
        <h2 data-i18n="elements.title"></h2>
        <ol id="elements" class="elements"></ol>
        <div class="add">
          <span data-i18n="elements.add"></span>
          <button data-add="text" data-i18n="elements.text"></button>
          <button id="btn-code" data-i18n="code.open" data-i18n-title="code.openHint"></button>
          <button data-add="image" data-i18n="elements.image"></button>
          <button data-add="symbol" data-i18n="elements.symbol"></button>
          <button data-add="fill" data-i18n="elements.fill"></button>
          <button data-add="shape" data-i18n="elements.shape"></button>
          <button data-add="table" data-i18n="elements.table"></button>
        </div>

        <h2 data-i18n="layout.title"></h2>
        <div class="grid">
          <label for="padding-start" data-i18n="layout.paddingStart" data-i18n-title="layout.marginHint"></label>
          <input id="padding-start" type="number" min="0" step="0.5" />
          <label for="padding" data-i18n="layout.padding" data-i18n-title="layout.marginHint"></label>
          <input id="padding" type="number" min="0" step="0.5" />
          <label for="min-length" data-i18n="layout.minLength"></label>
          <input id="min-length" type="number" min="0" step="1" data-i18n-placeholder="layout.auto" />
          <label for="fixed-length" data-i18n="layout.fixedLength" data-i18n-title="layout.fixedLengthHint"></label>
          <input id="fixed-length" type="checkbox" />
          <div id="edit-template-row" class="grid-full" hidden><button id="btn-edit-template" data-i18n="wizard.editTemplate"></button></div>
          <label for="orientation" data-i18n="layout.orientation"></label>
          <select id="orientation">
            <option value="landscape" data-i18n="layout.landscape"></option>
            <option value="portrait" data-i18n="layout.portrait"></option>
          </select>
        </div>

        <h2 data-i18n="border.title"></h2>
        <div class="decor-row">
          <span data-i18n="decor.label"></span>
          <button id="btn-decor" class="decor-choose"><img id="decor-thumb" alt="" hidden /><span id="decor-name"></span></button>
        </div>
        <div class="grid border-grid">
          <label for="border-style" data-i18n="border.style"></label>
          <select id="border-style">
            <option value="" data-i18n="border.none"></option>
            <option value="solid" data-i18n="border.solid"></option>
            <option value="dashed" data-i18n="border.dashed"></option>
            <option value="dotted" data-i18n="border.dotted"></option>
            <option value="double" data-i18n="border.double"></option>
            <option value="striped" data-i18n="border.striped"></option>
          </select>
          <label for="border-width" data-i18n="border.width" class="border-opt"></label>
          <input id="border-width" type="number" min="0.1" step="0.1" class="border-opt" />
          <label for="border-pattern" data-i18n="border.pattern" class="border-opt border-pattern"></label>
          <input id="border-pattern" type="number" min="0.2" step="0.1" class="border-opt border-pattern" />
          <label for="border-inset-top" data-i18n="border.insetTop" data-i18n-title="border.insetHint" class="border-opt"></label>
          <input id="border-inset-top" data-inset="top" type="number" min="0" step="0.1" class="border-opt" />
          <label for="border-inset-bottom" data-i18n="border.insetBottom" data-i18n-title="border.insetHint" class="border-opt"></label>
          <input id="border-inset-bottom" data-inset="bottom" type="number" min="0" step="0.1" class="border-opt" />
          <label for="border-inset-left" data-i18n="border.insetLeft" data-i18n-title="border.insetHint" class="border-opt"></label>
          <input id="border-inset-left" data-inset="left" type="number" min="0" step="0.1" class="border-opt" />
          <label for="border-inset-right" data-i18n="border.insetRight" data-i18n-title="border.insetHint" class="border-opt"></label>
          <input id="border-inset-right" data-inset="right" type="number" min="0" step="0.1" class="border-opt" />
        </div>
        <div class="border-sides border-opt">
          <span data-i18n="border.sides"></span>
          <label><input type="checkbox" data-side="top" /> <span data-i18n="border.top"></span></label>
          <label><input type="checkbox" data-side="bottom" /> <span data-i18n="border.bottom"></span></label>
          <label><input type="checkbox" data-side="left" /> <span data-i18n="border.left"></span></label>
          <label><input type="checkbox" data-side="right" /> <span data-i18n="border.right"></span></label>
        </div>

        <h2 data-i18n="numbering.title"></h2>
        <div class="grid">
          <label for="num-count" data-i18n="numbering.count"></label>
          <input id="num-count" type="number" min="0" value="0" />
          <label for="num-start" data-i18n="numbering.start"></label>
          <input id="num-start" type="number" value="1" />
          <label for="num-step" data-i18n="numbering.step"></label>
          <input id="num-step" type="number" value="1" />
        </div>
        <p class="muted hint" data-i18n="numbering.hint"></p>
        <div class="chips" id="num-chips">
          <button class="chip" data-token="n">{{n}}</button>
          <button class="chip" data-token="datum">{{datum}}</button>
          <button class="chip" data-token="zeit">{{zeit}}</button>
          <button class="chip" data-token="n:02">{{n:02}}</button>
          <button class="chip" data-token="n:03">{{n:03}}</button>
          <button class="chip" data-token="A">{{A}}</button>
          <button class="chip" data-token="a">{{a}}</button>
        </div>

        <h2 data-i18n="data.title"></h2>
        <div class="data">
          <div class="row">
            <button id="btn-csv" data-i18n="data.load"></button>
            <button id="btn-csv-sample" data-i18n="data.sample" data-i18n-title="data.sampleHint"></button>
            <span id="csv-name" class="muted filename" data-i18n="data.none"></span>
            <button id="btn-csv-clear" data-i18n-title="data.clear" hidden>✕</button>
          </div>
          <div id="csv-details" hidden>
            <p class="muted hint" data-i18n="data.columnsHint"></p>
            <div id="csv-columns" class="chips"></div>
            <div class="grid">
              <label for="preview-row" data-i18n="data.previewRow"></label>
              <input id="preview-row" type="number" min="1" value="1" />
            </div>
            <div class="rows">
              <label><input type="radio" name="rows" value="all" checked /> <span data-i18n="data.all"></span></label>
              <label><input type="radio" name="rows" value="range" /> <span data-i18n="data.from"></span></label>
              <input id="row-from" type="number" min="1" value="1" />
              <span data-i18n="data.to"></span>
              <input id="row-to" type="number" min="1" value="1" />
            </div>
            <p id="csv-summary" class="muted hint"></p>
          </div>
        </div>
      </aside>

      <section class="canvas">
        <div id="sheet-tabs" class="sheet-tabs"></div>
        <div class="zoom">
          <label><span data-i18n="preview.zoom"></span>
            <input id="zoom" type="range" min="0.5" max="12" step="0.25" value="4" />
          </label>
          <span id="dims" class="muted"></span>
          <label><span data-i18n="preview.tapeStyle"></span>
            <select id="tape-style"></select>
          </label>
          <label><span data-i18n="preview.quality"></span>
            <select id="quality">
              <option value="4" data-i18n="preview.smooth"></option>
              <option value="1" data-i18n="preview.raster"></option>
            </select>
          </label>
          <button id="btn-series" data-i18n="series.open" data-i18n-title="series.openHint" hidden></button>
          <button id="btn-export-png" data-i18n="export.png" data-i18n-title="export.pngHint"></button>
          <span class="spacer"></span>
          <span class="muted" data-i18n="preview.hint"></span>
        </div>
        <div class="tape-wrap" id="tape-wrap">
          <div id="ruler" class="ruler" aria-hidden="true"></div>
          <div class="stage-row" id="stage-row">
            <div id="vruler" class="vruler" aria-hidden="true"></div>
            <div class="tape-frame" id="tape-frame">
              <div class="stage" id="stage">
                <img id="preview" alt="" draggable="false" hidden />
                <div id="ink" class="ink"></div>
                <div id="strip-lines" class="strip-lines"></div>
                <div id="margin-start" class="margin-zone"></div>
                <div id="margin-end" class="margin-zone"></div>
                <div id="boxes" class="boxes"></div>
              </div>
            </div>
          </div>
          <p id="preview-msg" class="preview-msg"></p>
        </div>
      </section>
      <aside id="props" class="panel props">
        <h2 data-i18n="props.title"></h2>
        <div id="props-body"></div>
      </aside>
    </main>

    <footer class="printbar">
      <label><span data-i18n="print.copies"></span>
        <input id="copies" type="number" min="1" value="1" />
      </label>
      <label data-i18n-title="print.cutHint"><span data-i18n="print.cutMode"></span>
        <select id="cut-mode">
          <option value="each" data-i18n="print.cutEach"></option>
          <option value="end" data-i18n="print.cutEnd"></option>
          <option value="every" data-i18n="print.cutEvery"></option>
          <option value="chain" data-i18n="print.cutChain"></option>
          <option value="none" data-i18n="print.cutNone"></option>
        </select>
      </label>
      <label id="cut-every-wrap" hidden><span data-i18n="print.cutEveryN"></span>
        <input id="cut-every" type="number" min="2" value="2" />
      </label>
      <label data-i18n-title="print.cutMarksHint"><input id="cut-marks" type="checkbox" /> <span data-i18n="print.cutMarks"></span></label>
      <label data-i18n-title="print.mirrorHint"><input id="mirror" type="checkbox" /> <span data-i18n="print.mirror"></span></label>
      <label><span data-i18n="print.margin"></span>
        <input id="margin" type="number" min="0" />
      </label>
      <span id="message" class="message"></span>
      <span class="spacer"></span>
      <button id="btn-a4" data-i18n="a4.open" data-i18n-title="a4.openHint"></button>
      <button id="btn-feed-cut" data-i18n="print.feedCut" data-i18n-title="print.feedCutHint"></button>
      <button id="btn-print" class="primary" data-i18n="print.print"></button>
    </footer>

    <dialog id="pair-dialog">
      <form method="dialog" class="wizard">
        <h2 data-i18n="pair.title"></h2>
        <p class="muted hint" data-i18n="pair.hint"></p>
        <ul id="pair-list" class="pair-list"></ul>
        <p id="pair-msg" class="muted hint"></p>
        <div class="row end">
          <button id="pair-rescan" type="button" data-i18n="pair.rescan"></button>
          <button value="close" data-i18n="pair.close"></button>
        </div>
      </form>
    </dialog>

    <dialog id="symbol-dialog">
      <form method="dialog" class="symbol-picker">
        <div class="symbol-head">
          <h2 data-i18n="symbol.title"></h2>
          <input id="symbol-search" type="search" data-i18n-placeholder="symbol.search" />
        </div>
        <div class="symbol-body">
          <nav id="symbol-tree" class="symbol-tree"></nav>
          <div class="symbol-main">
            <p id="symbol-info" class="muted hint"></p>
            <div id="symbol-grid" class="symbol-grid"></div>
          </div>
        </div>
        <div class="row end">
          <span id="symbol-msg" class="muted hint spacer"></span>
          <button id="symbol-import" type="button" data-i18n="symbol.import"></button>
          <button id="symbol-remove" type="button" data-i18n="symbol.remove" hidden></button>
          <button value="close" data-i18n="symbol.close"></button>
        </div>
      </form>
    </dialog>

    <dialog id="history-dialog">
      <form method="dialog" class="wizard">
        <h2 data-i18n="history.title"></h2>
        <p id="history-msg" class="muted hint"></p>
        <ul id="history-list" class="history-list"></ul>
        <div class="row end">
          <button value="close" data-i18n="history.close"></button>
        </div>
      </form>
    </dialog>

    <dialog id="info-dialog">
      <form method="dialog" class="wizard">
        <h2 data-i18n="info.title"></h2>
        <p id="info-msg" class="muted hint"></p>
        <table id="info-table" class="info-table"></table>
        <h3 data-i18n="info.raw"></h3>
        <pre id="info-raw" class="info-raw"></pre>
        <p class="muted hint" data-i18n="info.rawHint"></p>
        <div class="row end">
          <button type="button" id="info-copy" data-i18n="info.copy"></button>
          <button type="button" id="info-reload" data-i18n="info.reload"></button>
          <button value="close" data-i18n="history.close"></button>
        </div>
      </form>
    </dialog>

    <div id="splash" class="splash" role="dialog" aria-modal="true">
      <div class="splash-card">
        <img id="splash-icon" alt="" />
        <h1>LabelLab <span id="splash-version" class="muted"></span></h1>
        <p data-i18n="about.tagline"></p>
        <p class="splash-dev"><span data-i18n="about.developer"></span> <strong>ITSH Neumeier – Timo Neumeier</strong></p>
        <p class="muted">© 2026 Timo Neumeier · ITSH Neumeier</p>
        <p class="muted" data-i18n="about.license"></p>
        <p class="muted small" data-i18n="about.thirdParty"></p>
        <p class="muted small" data-i18n="about.trademarks"></p>
        <p id="splash-hint" class="muted small" data-i18n="about.close"></p>
      </div>
    </div>

    <dialog id="decor-dialog">
      <form method="dialog" class="wizard">
        <h2 data-i18n="decor.title"></h2>
        <div id="decor-list" class="decor-list"></div>
        <div class="row end">
          <button type="button" id="decor-new" data-i18n="decor.new"></button>
          <button type="button" id="decor-import" data-i18n="decor.import"></button>
          <button value="close" data-i18n="history.close"></button>
        </div>
      </form>
    </dialog>

    <dialog id="frame-editor">
      <form method="dialog" class="wizard">
        <h2 data-i18n="frameEditor.title"></h2>
        <p class="muted hint" data-i18n="frameEditor.hint"></p>
        <label class="fe-namefield"><span data-i18n="frameEditor.name"></span><input id="fe-name" type="text" /></label>
        <div class="row fe-head">
          <div id="fe-tabs" class="seg-tabs">
            <button type="button" data-seg="start" data-i18n="frameEditor.start"></button>
            <button type="button" data-seg="middle" data-i18n="frameEditor.middle"></button>
            <button type="button" data-seg="end" data-i18n="frameEditor.end"></button>
          </div>
          <div class="seg-tabs">
            <button type="button" id="fe-mode-draw" data-i18n="paint.modeDraw"></button>
            <button type="button" id="fe-mode-code" data-i18n="paint.modeCode"></button>
          </div>
        </div>
        <div id="fe-paint" class="fe-paint">
          <div id="fe-tools" class="row fe-tools">
            <button type="button" data-tool="pencil" class="on" data-i18n-title="paint.pencil">✎</button>
            <button type="button" data-tool="eraser" data-i18n-title="paint.eraser">⌫</button>
            <button type="button" data-tool="line" data-i18n-title="paint.line">╱</button>
            <button type="button" data-tool="rect" data-i18n-title="paint.rect">▭</button>
            <button type="button" data-tool="ellipse" data-i18n-title="paint.ellipse">◯</button>
            <button type="button" data-tool="fill" data-i18n-title="paint.fill">◉</button>
            <select id="fe-brush" data-i18n-title="paint.brush">
              <option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option>
              <option value="4">4 px</option><option value="6">6 px</option><option value="8">8 px</option>
            </select>
            <label class="check"><input id="fe-filled" type="checkbox" /> <span data-i18n="paint.filled"></span></label>
            <span class="sep"></span>
            <button type="button" id="fe-undo" data-i18n-title="paint.undo">↶</button>
            <button type="button" id="fe-mirror" data-i18n-title="paint.mirror">⇋</button>
            <button type="button" id="fe-clear" data-i18n="paint.clear"></button>
            <button type="button" id="fe-from-start" data-i18n="paint.fromStart"></button>
          </div>
          <div class="row fe-tools">
            <label class="inline"><span data-i18n="paint.width"></span><input id="fe-width" type="number" min="1" max="2000" /></label>
            <label class="inline" data-i18n-title="paint.heightHint"><span data-i18n="paint.height"></span><input id="fe-height" type="number" min="8" max="512" /></label>
            <button type="button" id="fe-crop" data-i18n="paint.crop" data-i18n-title="paint.cropHint"></button>
            <span class="sep"></span>
            <button type="button" id="fe-insert" data-i18n="paint.insert"></button>
            <button type="button" id="fe-paste" data-i18n="paint.paste"></button>
          </div>
          <div id="fe-place" class="row fe-tools fe-place" hidden>
            <label class="inline"><span data-i18n="paint.scale"></span><input id="fe-place-scale" type="range" min="5" max="300" value="100" /></label>
            <label class="inline"><span data-i18n="paint.threshold"></span><input id="fe-place-threshold" type="range" min="1" max="254" value="128" /></label>
            <label class="check"><input id="fe-place-dither" type="checkbox" /> <span data-i18n="paint.dither"></span></label>
            <button type="button" id="fe-place-ok" class="primary" data-i18n="paint.placeOk"></button>
            <button type="button" id="fe-place-cancel" data-i18n="wizard.cancel"></button>
          </div>
          <div class="fe-canvas-wrap"><canvas id="fe-canvas"></canvas></div>
          <p class="muted hint" data-i18n="paint.hint"></p>
        </div>
        <div id="fe-code" class="fe-code" hidden>
          <textarea id="fe-svg" rows="8" spellcheck="false"></textarea>
          <div class="row"><button type="button" id="fe-load-svg" data-i18n="frameEditor.load"></button></div>
        </div>
        <div class="fe-preview"><img id="fe-preview" alt="" /></div>
        <p id="fe-msg" class="muted hint"></p>
        <div class="row end">
          <button value="cancel" data-i18n="wizard.cancel"></button>
          <button type="button" id="fe-save" class="primary" data-i18n="frameEditor.save"></button>
        </div>
      </form>
    </dialog>

    <div id="paste-catcher" contenteditable="true" aria-hidden="true" tabindex="-1"></div>

    <dialog id="image-dialog">
      <form method="dialog" class="image-editor">
        <h2 data-i18n="imgedit.title"></h2>
        <div class="ie-body">
          <div class="ie-stage-wrap">
            <div id="ie-stage" class="ie-stage">
              <img id="ie-img" alt="" draggable="false" />
              <div id="ie-crop" class="ie-crop">
                <div class="ie-h" data-h="nw"></div><div class="ie-h" data-h="ne"></div>
                <div class="ie-h" data-h="sw"></div><div class="ie-h" data-h="se"></div>
              </div>
            </div>
            <p id="ie-hint" class="muted hint" data-i18n="imgedit.cropHint"></p>
          </div>
          <div class="ie-controls">
            <div class="row">
              <button type="button" id="ie-rotate" data-i18n="imgedit.rotate"></button>
              <button type="button" id="ie-flip-h" data-i18n="imgedit.flipH"></button>
              <button type="button" id="ie-flip-v" data-i18n="imgedit.flipV"></button>
            </div>
            <button type="button" id="ie-crop-reset" data-i18n="imgedit.cropReset"></button>
            <h3 data-i18n="imgedit.background"></h3>
            <label class="check"><input type="checkbox" id="ie-bg" /> <span data-i18n="imgedit.removeBg"></span></label>
            <div id="ie-bg-opts">
              <div class="row">
                <span id="ie-swatch" class="ie-swatch"></span>
                <button type="button" id="ie-pick" data-i18n="imgedit.pick"></button>
                <button type="button" id="ie-auto" data-i18n="imgedit.auto"></button>
              </div>
              <label class="range-row"><span data-i18n="imgedit.tolerance"></span><input type="range" id="ie-tol" min="0" max="100" /><output id="ie-tol-out"></output></label>
              <label class="check"><input type="checkbox" id="ie-contig" /> <span data-i18n="imgedit.contiguous"></span></label>
            </div>
            <h3 data-i18n="imgedit.print"></h3>
            <select id="ie-halftone">
              <option value="dither" data-i18n="imgedit.dither"></option>
              <option value="threshold" data-i18n="imgedit.threshold"></option>
            </select>
            <label class="range-row" id="ie-thr-row"><span data-i18n="imgedit.level"></span><input type="range" id="ie-thr" min="1" max="254" /><output id="ie-thr-out"></output></label>
            <h3 data-i18n="imgedit.result"></h3>
            <div class="ie-result"><img id="ie-result" alt="" /></div>
          </div>
        </div>
        <div class="row end">
          <button value="cancel" data-i18n="wizard.cancel"></button>
          <button id="ie-apply" value="apply" class="primary" data-i18n="imgedit.apply"></button>
        </div>
      </form>
    </dialog>

    <dialog id="series-dialog">
      <form method="dialog" class="wizard">
        <h2 data-i18n="series.title"></h2>
        <p id="series-msg" class="muted hint"></p>
        <div id="series-list" class="series-list"></div>
        <div class="row end">
          <button value="close" data-i18n="series.close"></button>
        </div>
      </form>
    </dialog>

    <dialog id="code-dialog">
      <form method="dialog" class="wizard code-wizard">
        <h2 data-i18n="code.title"></h2>
        <div class="code-grid">
          <label><span data-i18n="code.type"></span><select id="cw-type"></select></label>
          <label id="cw-kind-row"><span data-i18n="code.kind"></span>
            <select id="cw-kind">
              <option value="text" data-i18n="code.kindText"></option>
              <option value="url" data-i18n="code.kindUrl"></option>
              <option value="wifi" data-i18n="code.kindWifi"></option>
              <option value="vcard" data-i18n="code.kindVcard"></option>
              <option value="email" data-i18n="code.kindEmail"></option>
              <option value="tel" data-i18n="code.kindTel"></option>
            </select>
          </label>
          <div class="cw-group" data-kinds="text barcode">
            <label><span data-i18n="elements.data"></span><textarea id="cw-text" rows="2"></textarea></label>
          </div>
          <div class="cw-group" data-kinds="url">
            <label><span data-i18n="code.url"></span><input id="cw-url" type="text" value="https://" /></label>
          </div>
          <div class="cw-group" data-kinds="wifi">
            <label><span data-i18n="code.ssid"></span><input id="cw-ssid" type="text" /></label>
            <label><span data-i18n="code.password"></span><input id="cw-pass" type="text" /></label>
            <label><span data-i18n="code.security"></span>
              <select id="cw-sec">
                <option value="WPA">WPA/WPA2/WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass" data-i18n="code.noPassword"></option>
              </select>
            </label>
            <label class="check"><input id="cw-hidden" type="checkbox" /> <span data-i18n="code.hiddenNet"></span></label>
          </div>
          <div class="cw-group" data-kinds="vcard">
            <label><span data-i18n="code.name"></span><input id="cw-vname" type="text" /></label>
            <label><span data-i18n="code.org"></span><input id="cw-vorg" type="text" /></label>
            <label><span data-i18n="code.phone"></span><input id="cw-vtel" type="text" /></label>
            <label><span data-i18n="code.email"></span><input id="cw-vmail" type="text" /></label>
            <label><span data-i18n="code.url"></span><input id="cw-vurl" type="text" /></label>
          </div>
          <div class="cw-group" data-kinds="email">
            <label><span data-i18n="code.email"></span><input id="cw-mail" type="text" /></label>
            <label><span data-i18n="code.subject"></span><input id="cw-subject" type="text" /></label>
          </div>
          <div class="cw-group" data-kinds="tel">
            <label><span data-i18n="code.phone"></span><input id="cw-tel" type="text" /></label>
          </div>
        </div>
        <div class="wz-preview"><img id="cw-preview" alt="" /></div>
        <p class="muted hint" id="cw-info"></p>
        <div class="row end">
          <button value="cancel" data-i18n="wizard.cancel"></button>
          <button id="cw-apply" value="apply" class="primary" data-i18n="code.insert"></button>
        </div>
      </form>
    </dialog>

    <dialog id="a4-dialog">
      <form method="dialog" class="wizard a4-dialog">
        <h2 data-i18n="a4.title"></h2>
        <div class="a4-cols">
          <div class="a4-settings">
            <h3 data-i18n="a4.sheets"></h3>
            <div id="a4-sheets" class="a4-sheets"></div>
            <h3 data-i18n="a4.look"></h3>
            <label class="check"><input id="a4-header" type="checkbox" checked /> <span data-i18n="a4.header"></span></label>
            <label class="check"><input id="a4-gray" type="checkbox" /> <span data-i18n="a4.gray"></span></label>
            <label class="check"><input id="a4-outline" type="checkbox" checked /> <span data-i18n="a4.outline"></span></label>
            <label><span data-i18n="a4.colors"></span>
              <select id="a4-colors">
                <option value="tape" data-i18n="a4.colorsTape"></option>
                <option value="custom" data-i18n="a4.colorsCustom"></option>
                <option value="plain" data-i18n="a4.colorsPlain"></option>
              </select>
            </label>
            <div id="a4-custom" class="row" hidden>
              <label class="inline"><span data-i18n="a4.background"></span><input id="a4-bg" type="color" value="#fff200" /></label>
              <label class="inline"><span data-i18n="a4.ink"></span><input id="a4-ink" type="color" value="#000000" /></label>
            </div>
            <label><span data-i18n="a4.gap"></span><input id="a4-gap" type="number" min="0" step="0.5" value="3" /></label>
            <h3 data-i18n="a4.calibration"></h3>
            <p class="muted hint" data-i18n="a4.calibrationHint"></p>
            <label><span data-i18n="a4.scaleX"></span><input id="a4-sx" type="number" min="50" max="150" step="0.1" value="100" /></label>
            <label><span data-i18n="a4.scaleY"></span><input id="a4-sy" type="number" min="50" max="150" step="0.1" value="100" /></label>
            <label><span data-i18n="a4.measuredX"></span><input id="a4-mx" type="number" min="50" max="150" step="0.5" data-i18n-placeholder="a4.measuredPlaceholder" /></label>
            <label><span data-i18n="a4.measuredY"></span><input id="a4-my" type="number" min="50" max="150" step="0.5" data-i18n-placeholder="a4.measuredPlaceholder" /></label>
            <div class="row">
              <button type="button" id="a4-test" data-i18n="a4.test"></button>
              <button type="button" id="a4-apply-measure" data-i18n="a4.applyMeasure"></button>
            </div>
          </div>
          <div class="a4-preview-wrap">
            <div id="a4-preview" class="a4-preview"></div>
            <p id="a4-info" class="muted hint"></p>
          </div>
        </div>
        <div class="row end">
          <button value="cancel" data-i18n="wizard.cancel"></button>
          <button id="a4-print-btn" value="print" class="primary" data-i18n="a4.print"></button>
        </div>
      </form>
    </dialog>

    <div id="a4-print"></div>

    <dialog id="wizard">
      <form method="dialog" class="wizard">
        <h2 data-i18n="wizard.title"></h2>
        <input id="wz-kind" type="hidden" value="cable_flag" />
        <div id="wz-gallery" class="wz-gallery"></div>
        <div id="wz-preview" class="wz-preview"><img id="wz-preview-img" alt="" /></div>
        <div class="wz-group" data-kind="asset_tag">
          <label><span data-i18n="wizard.owner"></span><input id="wz-owner" type="text" value="" data-i18n-placeholder="wizard.ownerHint" /></label>
          <label><span data-i18n="wizard.number"></span><input id="wz-number" type="text" value="INV-{{n:05}}" /></label>
          <label><span data-i18n="wizard.code"></span>
            <select id="wz-code">
              <option value="qr">QR</option>
              <option value="code128">Code 128</option>
              <option value="none" data-i18n="wizard.codeNone"></option>
            </select>
          </label>
          <label><span data-i18n="wizard.codeData"></span><input id="wz-code-data" type="text" value="" data-i18n-placeholder="wizard.codeDataHint" /></label>
          <label><span data-i18n="wizard.lengthMm"></span><input id="wz-length" type="number" min="10" step="1" value="50" /></label>
          <p class="muted hint" data-i18n="wizard.assetHint"></p>
        </div>
        <div class="wz-group" data-kind="cable_flag cable_wrap single_flag">
          <label><span data-i18n="wizard.text"></span><input id="wz-text" type="text" value="Kabel 1" /></label>
          <label><span data-i18n="wizard.diameter"></span><input id="wz-diameter" type="number" min="0.5" step="0.5" value="6" /></label>
        </div>
        <div class="wz-group" data-kind="cable_flag single_flag">
          <label><span data-i18n="wizard.flag"></span><input id="wz-flag" type="number" min="5" step="1" value="25" /></label>
          <label class="check" data-i18n-title="wizard.centerMarkHint"><input id="wz-center-mark" type="checkbox" /> <span data-i18n="wizard.centerMark"></span></label>
        </div>
        <div class="wz-group" data-kind="cable_wrap">
          <label><span data-i18n="wizard.repeats"></span><input id="wz-repeats" type="number" min="0" step="1" value="0" data-i18n-placeholder="layout.auto" /></label>
          <label class="check"><input id="wz-vertical" type="checkbox" checked /> <span data-i18n="wizard.vertical"></span></label>
        </div>
        <div class="wz-group" data-kind="patch_panel terminal_block fuse_box">
          <label><span data-i18n="wizard.count"></span><input id="wz-count" type="number" min="1" value="24" /></label>
          <label><span data-i18n="wizard.pitch"></span><input id="wz-pitch" type="number" min="1" step="0.1" value="12.7" /></label>
          <label><span data-i18n="wizard.prefix"></span><input id="wz-prefix" type="text" value="" /></label>
          <label><span data-i18n="numbering.start"></span><input id="wz-start" type="number" value="1" /></label>
          <label><span data-i18n="numbering.step"></span><input id="wz-step" type="number" value="1" /></label>
          <label><span data-i18n="wizard.digits"></span><input id="wz-digits" type="number" min="0" max="6" value="0" /></label>
          <label><span data-i18n="wizard.margin"></span><input id="wz-margin" type="number" min="0" step="0.5" value="0" /></label>
          <label class="check"><input id="wz-separators" type="checkbox" checked /> <span data-i18n="wizard.separators"></span></label>
        </div>
        <div class="wz-group" data-kind="terminal_block">
          <label><span data-i18n="wizard.rows"></span>
            <select id="wz-rows"><option value="1">1</option><option value="2" selected>2</option></select>
          </label>
        </div>
        <div class="wz-group" data-kind="fuse_box">
          <label class="check"><input id="wz-fb-vertical" type="checkbox" checked /> <span data-i18n="wizard.verticalText"></span></label>
          <label><span data-i18n="wizard.mainSwitch"></span><input id="wz-main" type="text" value="HAUPTSCHALTER" /></label>
          <label><span data-i18n="wizard.mainSwitchWidth"></span><input id="wz-main-width" type="number" min="5" step="0.5" value="35" /></label>
          <label class="check"><input id="wz-main-right" type="checkbox" /> <span data-i18n="wizard.mainSwitchRight"></span></label>
          <p class="muted hint" data-i18n="wizard.fieldsHint"></p>
          <div id="wz-fb-fields" class="fb-fields"></div>
        </div>
        <p class="muted hint" id="wz-info"></p>
        <div class="row end">
          <label class="wz-target"><span data-i18n="wizard.target"></span>
            <select id="wz-target">
              <option value="insert" data-i18n="wizard.targetInsert"></option>
              <option value="replace" data-i18n="wizard.targetReplace"></option>
              <option value="sheet" data-i18n="wizard.targetSheet"></option>
              <option value="file" data-i18n="wizard.targetFile"></option>
            </select>
          </label>
          <button value="cancel" data-i18n="wizard.cancel"></button>
          <button id="wz-create" value="create" class="primary" data-i18n="wizard.create"></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
