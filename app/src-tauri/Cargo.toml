[package]
name = "labellab-app"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "LabelLab desktop GUI (Tauri 2)"

# Own workspace: building Tauri needs WebKitGTK on Linux, which the
# library crates' CI job doesn't install (see ADR-014).
[workspace]

[lib]
name = "labellab_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Clipboard images: WebKitGTK does not pass pasted images to the page.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
ll-core = { path = "../../crates/ll-core" }
ll-protocol = { path = "../../crates/ll-protocol" }
ll-render = { path = "../../crates/ll-render" }
base64 = "0.22"
# Same version as ll-render; encodes the image editor previews.
image = { version = "0.25", default-features = false, features = ["png"] }
